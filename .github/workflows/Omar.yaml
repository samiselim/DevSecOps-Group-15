name: omar-workflow
run-name: ${{github.actor}} is testing the workflow 

on:
 workflow_dispatch:
    inputs:
     env:
      type: choice
      default: qa
      options:
       - dev
       - prod

jobs:
 prod-job:
   if: inputs.env == 'prod'
   runs-on: ubuntu-latest
   steps:
    - name: "echo message"
      run: |
       echo "this omar from prod " > text.txt
       cat text.txt
    - name: what files are here?
      run: ls -la
 
 dev-job:
   if: inputs.env == 'dev'
   runs-on: ubuntu-latest
   steps:
    - name: "echo message"
      run: |
       echo "this omar from env " > text.txt
       cat text.txt
    - name: what files are here?
      run:  ls -la