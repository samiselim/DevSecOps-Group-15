name: build-workflow_Ahmed Walid

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  prod-job:
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and deploy to production
        run: |
          touch output.txt
          echo "Building and deploying to production environment" >> output.txt
          cat output.txt
          ls -la
          # Add your build and deployment commands here

  dev-job:
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and deploy to development
        run: |
          touch output.txt
          echo "Building and deploying to development environment" >> output.txt
          cat output.txt
          ls -la
          # Add your build and deployment commands here