name: Build and Echo Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build Step
  build-job:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.set-status.outputs.status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build
        run: |
          echo "Building the application..."
          # Insert your build commands here (e.g., docker build, npm run build)

      - name: Set Status Output
        id: set-status
        run: echo "status=success" >> $GITHUB_OUTPUT

  # Job 2: Echo Step (Runs conditionally)
  echo-job:
    runs-on: ubuntu-latest
    needs: build-job
    if: ${{ needs.build-job.result == 'success' && needs.build-job.outputs.build_status == 'success' }}
    steps:
      - name: Print Success Message
        run: |
          echo "Build completed successfully! Proceeding with post-build actions."