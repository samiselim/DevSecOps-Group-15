
name: abdelrahmanelhossinii

run-name: abdelrahmanelhossinii-${{ github.run_number }}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute script
        run: python3 abdelrahmanelhossini/task-2/calculator.py
