name: Abdelrahman_nagty

run-name: Deploy  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      env:
        description: "env"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  dev:
    if: ${{ inputs.env == 'dev' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: echo dev
        run: echo "runing by nagaty@dev"
      - name: list files
        run: ls -la

  prod:
    if: ${{ inputs.env == 'prod' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
     
      - name: echo prod
        run: echo "runing by nagaty@prod" > myecho.md
      - name: list files
        run: ls -la
