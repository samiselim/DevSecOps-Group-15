name: Mohamed Ezzat workflow test
run-name: Mohamed Ezzat workflow test ${{ github.run_number }}
on:
  workflow_dispatch:
   inputs:
    env:
      description: 'Environment'
      required: true
      default: 'dev'
      type: choice
      options:
        - dev
        - staging
        - prod
jobs:
  build:
    if: inputs.env == 'dev' 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Print environment
        run: |
          ls -la
          echo "Environment: ${{ github.event.inputs.env }}"  
          echo "Hello, this is a test workflow for Mohamed Ezzat in the DevSecOps Group 15 repository!" >> test.txt
          cat test.txt  
  deploy:
    if: inputs.env != 'dev'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Deploy to environment
        run: |
          ls -la
          echo "Deploying to ${{ github.event.inputs.env }} environment"    
          job_name="deploy-${{ github.event.inputs.env }}"
          echo "Job name: $job_name"
          echo "Hello, this is a deployment job for the ${{ github.event.inputs.env }} environment!" >> deploy.txt
          cat deploy.txt